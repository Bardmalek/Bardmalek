  <rect x="28" y="138" width="56" height="26" rx="8" fill="#fff" fill-opacity=".07"/><text x="36" y="156" fill="#B9D7E6" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5">Python</text><rect x="92" y="138" width="56" height="26" rx="8" fill="#fff" fill-opacity=".07"/><text x="100" y="156" fill="#B9D7E6" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5">pytest</text><rect x="156" y="138" width="35" height="26" rx="8" fill="#fff" fill-opacity=".07"/><text x="164" y="156" fill="#B9D7E6" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5">UDP</text>
