<svg width="580" height="190" viewBox="0 0 580 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="X-Plane Emergency Assistant. Typed telemetry and a rule-based decision engine, with a simulator that needs no X-Plane.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="580" y2="190" gradientUnits="userSpaceOnUse"><stop stop-color="#101A31"/><stop offset="1" stop-color="#132D47"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="580" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#75E5D1" stop-opacity="0"/><stop offset=".5" stop-color="#75E5D1"/><stop offset="1" stop-color="#75E5D1" stop-opacity="0"/></linearGradient>
    <style>
      .sweep { animation: sweep 4.5s ease-in-out infinite; }
      @keyframes sweep { 0%,100% { transform: translateX(-280px); } 50% { transform: translateX(280px); } }
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
    <clipPath id="c"><rect width="580" height="190" rx="16"/></clipPath>
  </defs>
  <rect width="580" height="190" rx="16" fill="url(#g)"/>
  <rect x=".5" y=".5" width="579" height="189" rx="15.5" stroke="#fff" stroke-opacity=".12"/>
