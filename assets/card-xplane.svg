  <rect x="28" y="24" width="155" height="24" rx="12" fill="#75E5D1" fill-opacity=".16" stroke="#75E5D1" stroke-opacity=".6"/>
  <text x="105" y="40.5" text-anchor="middle" fill="#75E5D1" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing=".8">18 TESTS · CI GREEN</text>
  <text x="28" y="82" fill="#F4FBFF" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="22" font-weight="750">X-Plane Emergency Assistant</text>
  <text x="28" y="108" fill="#B9D7E6" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5">Typed telemetry and a rule-based decision engine,</text>
